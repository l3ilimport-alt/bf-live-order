<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הזמנה — ביוטי פייבוריטס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{
  --bg:#F7F5F1; --card:#FFFFFF; --line:#E3DED5; --line2:#C9BFB0;
  --ink:#26221E; --mut:#7A7168; --accent:#8C5A38; --green:#2F6B45;
  --sans:'Heebo',-apple-system,'Segoe UI',sans-serif;
  --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 104px}

header{text-align:center;padding:6px 0 14px;border-bottom:2px solid var(--line2)}
h1{font-family:var(--serif);font-size:25px;margin:0}
.sub{color:var(--mut);font-size:12.5px;margin-top:3px}

/* שורת המצב — מי ערך אחרון ומתי, וכן מצב הסנכרון */
.bar2{display:flex;align-items:center;justify-content:space-between;gap:10px;
margin-top:12px;padding:9px 12px;background:var(--card);border:1px solid var(--line);
border-radius:10px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);
display:inline-block;margin-left:6px;vertical-align:middle}
.dot.off{background:#B0453A}
.dot.busy{background:#C08A2E}
#me{width:110px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;
padding:5px 8px;font-family:inherit;font-size:12.5px;color:var(--ink);text-align:right}
#me:focus{outline:none;border-color:var(--accent)}

.note{border-radius:11px;padding:10px 13px;margin-top:12px;font-size:13.5px}
.note.warn{background:#FBEFEC;border:1px solid #E8C4B8;color:#8A4029}
.note[hidden]{display:none}

.list{margin-top:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:11px 12px;margin-bottom:9px;display:grid;gap:8px}
.c.on{border-color:var(--accent);background:#FBF7F0}
.top{display:flex;gap:11px;align-items:flex-start}
.top img{width:62px;height:62px;object-fit:contain;background:#fff;
border:1px solid var(--line);border-radius:8px;flex:0 0 62px}
.ti{min-width:0;flex:1}
.br{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.11em;
text-transform:uppercase}
.nm{font-size:14px;font-weight:600;line-height:1.32;margin:1px 0}
.vr{font-size:11.5px;color:var(--mut)}
.f{background:var(--bg);border-radius:7px;padding:7px 10px;display:flex;
align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.f span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.f b{white-space:nowrap;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
padding:7px 0;border-top:1px solid var(--line)}
.row label{font-size:13px;color:var(--mut);white-space:nowrap}
input.n{width:106px;flex:0 0 106px;background:#fff;border:1px solid var(--line2);
border-radius:8px;padding:9px 7px;font-family:inherit;font-size:16px;
text-align:center;color:var(--ink);direction:ltr;-webkit-appearance:none}
input.n:focus{outline:none;border-color:var(--accent);
box-shadow:0 0 0 3px rgba(140,90,56,.13)}
input.np{background:#FFFDF8}
.sum{display:flex;justify-content:space-between;padding-top:7px;
border-top:1px solid var(--line);font-size:15px;font-weight:700}
.sum span{font-size:13px;color:var(--mut);font-weight:400}
.sum.has{color:var(--green)}

.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);
border-top:1px solid var(--line2);padding:10px 12px;display:flex;gap:8px;
align-items:center;justify-content:center;flex-wrap:wrap;
box-shadow:0 -4px 16px rgba(38,34,30,.07)}
.tot{font-family:var(--serif);font-size:19px;font-weight:700;
font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--mut);font-family:var(--sans);font-weight:400}
.act{background:var(--ink);color:#fff;border:0;border-radius:40px;padding:10px 18px;
font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;line-height:1.2;
white-space:nowrap}
a.act{text-decoration:none;display:inline-flex;align-items:center}
.act.wa{background:var(--green);color:#fff}
.act.gh{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.act.off{opacity:.45;pointer-events:none}

/* הדפסה ופי די אף — רק השורות שמולאו, בלי כרומיום של מסך */
#psum{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .bar,.bar2,.note,.top img{display:none!important}
  .wrap{max-width:none;padding:0}
  .c{display:none}
  .c.on{display:block;break-inside:avoid;border-color:var(--line);background:#fff}
  .row{padding:4px 0}
  input.n{border:0;background:transparent;font-size:14px;width:auto;flex:none;
  text-align:left;padding:0;font-weight:700}
  #psum{display:flex;justify-content:space-between;font-family:var(--serif);
  font-size:19px;font-weight:700;border-top:2px solid var(--line2);
  padding-top:10px;margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>הזמנה — ביוטי פייבוריטס</h1>
  <div class="sub" id="sub"></div>
</header>

<div class="bar2">
  <div><span class="dot" id="dot"></span><span id="state">מתחבר…</span></div>
  <label style="display:flex;align-items:center;gap:6px">השם שלי
    <input id="me" placeholder="מי אני" autocomplete="off"></label>
</div>

<div class="note warn" id="nwarn" hidden></div>

<div class="list" id="list"></div>
<div id="psum"><span>סה״כ ההזמנה</span><b id="ptot">$0</b></div>

</div>

<div class="bar">
  <div class="tot"><span>סה״כ</span> <b id="btot">$0</b></div>
  <a class="act wa" id="wa" href="https://wa.me/" target="_blank" rel="noopener">שליחה בוואטסאפ</a>
  <button class="act gh" id="pdf">שמירה כ‑PDF</button>
  <button class="act gh" id="copy">העתקה</button>
</div>

<script>
(function(){
  var SB   = { url: 'https://ieifiducsmiabncwwmiz.supabase.co', key: 'sb_publishable_vvhhk186MODu13GS60Uc0g_PW1HfgQy', doc: 'tom-order-b1-sivL9PGztjLXExhaGhiTn' };
  var $    = function(i){ return document.getElementById(i); };
  var P    = JSON.parse($('products').textContent);
  var ORDER = {};            /* מה שמוסכם עם השרת */
  var DIRTY = {};            /* מה ששיניתי ועוד לא נשלח */
  var SEEN  = null;          /* חותמת העדכון האחרונה שראיתי */
  var BUSY  = false;

  function money(n){ return '$' + n.toLocaleString('en-US',{maximumFractionDigits:0}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
    function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ── מי אני — נשמר בדפדפן, מופיע לצד כל עדכון ── */
  var me = '';
  try { me = localStorage.getItem('bf_me') || ''; } catch(e){}
  $('me').value = me;
  $('me').addEventListener('input', function(){
    me = $('me').value.trim();
    try { localStorage.setItem('bf_me', me); } catch(e){}
  });

  /* ── דיבור עם המסד ── */
  function headers(extra){
    var h = { apikey: SB.key, Authorization: 'Bearer ' + SB.key };
    for (var k in (extra||{})) h[k] = extra[k];
    return h;
  }
  function pull(){
    return fetch(SB.url + '/rest/v1/live_docs?key=eq.' +
                 encodeURIComponent(SB.doc) + '&select=data,updated_at,updated_by',
                 { headers: headers(), cache: 'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(a){ return a[0] || null; });
  }
  function push(order){
    return fetch(SB.url + '/rest/v1/live_docs?key=eq.' + encodeURIComponent(SB.doc),
      { method: 'PATCH',
        headers: headers({ 'Content-Type':'application/json', Prefer:'return=representation' }),
        body: JSON.stringify({ data: { order: order }, updated_by: me || 'ללא שם' }) })
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+t); });
        return r.json();
      }).then(function(a){ return a[0] || null; });
  }

  function state(txt, cls){
    $('state').textContent = txt;
    $('dot').className = 'dot' + (cls ? ' ' + cls : '');
  }
  function warn(txt){
    var w = $('nwarn');
    if (!txt){ w.hidden = true; return; }
    w.hidden = false; w.textContent = txt;
  }
  function ago(iso){
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 45) return 'ממש עכשיו';
    if (s < 3600) return 'לפני ' + Math.round(s/60) + ' דק׳';
    if (s < 86400) return 'לפני ' + Math.round(s/3600) + ' שע׳';
    return new Date(iso).toLocaleDateString('he-IL');
  }

  /* ── ציור ── */
  function draw(){
    $('sub').textContent = 'קישור חי · ' + P.length + ' מוצרים · 01/09/2026';
    $('list').innerHTML = P.map(function(p,i){
      return '<article class="c" data-i="'+i+'">' +
        '<div class="top">' +
          (p.img ? '<img src="'+p.img+'" alt="">' : '') +
          '<div class="ti"><div class="br">'+esc(p.brand)+'</div>' +
          '<div class="nm">'+esc(p.name)+'</div>' +
          '<div class="vr">'+esc(p.var)+(p.size?' · '+esc(p.size):'')+'</div></div>' +
        '</div>' +
        '<div class="f"><span>'+p.upb.toLocaleString()+' יח׳ בקופסה</span>' +
          '<span>$'+p.unit.toFixed(2)+' ליחידה</span>' +
          '<b>'+money(p.upb*p.unit)+' לקופסה</b></div>' +
        '<div class="row"><label>כמה קופסאות</label>' +
          '<input class="n q" type="number" min="0" step="1" placeholder="0"></div>' +
        '<div class="row"><label>מחיר מעודכן</label>' +
          '<input class="n np" type="number" min="0" step="0.01" placeholder="'+
            p.unit.toFixed(2)+'"></div>' +
        '<div class="sum"><span>סה״כ לשורה</span><b class="s">—</b></div>' +
      '</article>';
    }).join('');
    apply();
  }

  /* מזרים את המצב לשדות — בלי לדרוס שדה שמקלידים בו כרגע */
  function apply(){
    [].forEach.call(document.querySelectorAll('.c'), function(c){
      var i = c.dataset.i, o = ORDER[i] || {}, d = DIRTY[i];
      var q = c.querySelector('.q'), np = c.querySelector('.np');
      var src = d !== undefined ? (d || {}) : o;
      if (document.activeElement !== q)  q.value  = src.q ? src.q : '';
      if (document.activeElement !== np) np.value = src.p ? src.p : '';
    });
    calc();
  }

  function calc(){
    var tot = 0;
    [].forEach.call(document.querySelectorAll('.c'), function(c){
      var p = P[+c.dataset.i];
      var q = parseFloat(c.querySelector('.q').value) || 0;
      var np = parseFloat(c.querySelector('.np').value);
      var unit = (!isNaN(np) && np > 0) ? np : p.unit;
      var s = q * p.upb * unit; tot += s;
      c.querySelector('.s').textContent = q ? money(s) : '—';
      c.querySelector('.sum').classList.toggle('has', q > 0);
      c.classList.toggle('on', q > 0);
    });
    $('btot').textContent = money(tot);
    $('ptot').textContent = money(tot);
    var t = tot > 0 ? orderText() : null;
    $('wa').href = 'https://wa.me/?text=' + encodeURIComponent(t || 'הזמנה — ביוטי פייבוריטס');
    $('wa').classList.toggle('off', !t);
  }

  function orderText(){
    var L = ['*הזמנה — ביוטי פייבוריטס*', ''], tot = 0, n = 0;
    [].forEach.call(document.querySelectorAll('.c'), function(c){
      var p = P[+c.dataset.i];
      var q = parseFloat(c.querySelector('.q').value) || 0;
      if (!q) return;
      var np = parseFloat(c.querySelector('.np').value);
      var unit = (!isNaN(np) && np > 0) ? np : p.unit;
      var s = q * p.upb * unit; tot += s; n++;
      L.push(n + '. ' + p.brand + ' — ' + p.name + (p.var ? ' (' + p.var + ')' : ''));
      L.push('   ' + q + (q === 1 ? ' קופסה × ' : ' קופסאות × ') + p.upb +
             ' יח׳ × $' + unit.toFixed(2) +
             (isNaN(np) || np <= 0 ? '' : ' (מחיר מעודכן)') + ' = ' + money(s));
    });
    if (!n) return null;
    L.push(''); L.push('*סה״כ: ' + money(tot) + '*');
    return L.join('\n');
  }

  /* ── שינוי בשדה → מסומן ונשלח אחרי הפוגה קצרה ── */
  var timer = null;
  document.addEventListener('input', function(ev){
    var c = ev.target.closest && ev.target.closest('.c');
    if (!c || !ev.target.classList.contains('n')) return;
    var i = c.dataset.i;
    var q = parseFloat(c.querySelector('.q').value) || 0;
    var np = parseFloat(c.querySelector('.np').value);
    if (!q) DIRTY[i] = null;
    else { DIRTY[i] = { q: q }; if (!isNaN(np) && np > 0) DIRTY[i].p = np; }
    calc();
    state('נשמר עוד רגע…', 'busy');
    clearTimeout(timer);
    timer = setTimeout(sync, 1200);
  });

  /* מיזוג לפני כתיבה: מושכים את המצב העדכני ומחילים עליו רק את מה
     ששיניתי — כדי לא לדרוס שורה שהצד השני ערך באותו זמן. */
  function sync(){
    if (BUSY || !Object.keys(DIRTY).length) return;
    BUSY = true;
    state('שומר…', 'busy');
    var mine = DIRTY; DIRTY = {};
    pull().then(function(row){
      var merged = (row && row.data && row.data.order) || {};
      for (var i in mine){ if (mine[i]) merged[i] = mine[i]; else delete merged[i]; }
      return push(merged);
    }).then(function(row){
      ORDER = (row && row.data && row.data.order) || {};
      SEEN = row && row.updated_at;
      BUSY = false; warn('');
      apply();
      state('מסונכרן · ' + (row && row.updated_by ? row.updated_by + ' · ' : '') +
            ago(SEEN));
      if (Object.keys(DIRTY).length) sync();
    }).catch(function(e){
      BUSY = false;
      for (var i in mine) if (!(i in DIRTY)) DIRTY[i] = mine[i];   /* לא לאבד */
      state('לא נשמר', 'off');
      warn('אין כרגע חיבור לשרת. מה שמילאת נשמר במסך וייכתב מעצמו כשהחיבור יחזור.');
      console.warn('sync failed:', e && e.message);
    });
  }

  /* ── משיכה תקופתית — כך שינוי של הצד השני מגיע לכאן ── */
  function poll(){
    if (BUSY) return;
    pull().then(function(row){
      warn('');
      if (!row){
        state('המסמך לא נמצא', 'off');
        warn('הקישור לא מחובר למסמך. שלחו לנו הודעה ונתקן.');
        return;
      }
      if (row.updated_at !== SEEN){
        SEEN = row.updated_at;
        ORDER = (row.data && row.data.order) || {};
        apply();
      }
      state('מסונכרן · ' + (row.updated_by ? row.updated_by + ' · ' : '') + ago(SEEN));
      if (Object.keys(DIRTY).length) sync();
    }).catch(function(e){
      state('אין חיבור', 'off');
      console.warn('poll failed:', e && e.message);
    });
  }

  $('pdf').addEventListener('click', function(){
    if (!orderText()){ warn('אין מה להדפיס — לא מולאו כמויות.'); return; }
    warn(''); window.print();
  });

  $('copy').addEventListener('click', function(){
    var t = orderText();
    if (!t){ warn('לא מולאו כמויות.'); return; }
    warn('');
    navigator.clipboard.writeText(t).then(function(){
      var b = $('copy'); b.textContent = '✓ הועתק';
      setTimeout(function(){ b.textContent = 'העתקה'; }, 1800);
    }, function(){ warn(t); });
  });

  window.addEventListener('beforeunload', function(e){
    if (Object.keys(DIRTY).length){ e.preventDefault(); e.returnValue = ''; }
  });

  draw();
  poll();
  setInterval(poll, 4000);
})();
</script>
</body>
